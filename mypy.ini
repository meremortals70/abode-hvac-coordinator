# Type checking for the pure modules.
#
# The seven modules that import nothing from Home Assistant are checked in full
# strict mode, on any machine, with nothing installed. The Home Assistant
# modules are annotated to the same standard, but they can only be checked in an
# environment where Home Assistant is present, so errors in anything reached by
# following an import are silenced rather than reported here.

[mypy]
python_version = 3.13
strict = True
warn_unreachable = True
show_error_codes = True
pretty = True
follow_imports = silent

[mypy-homeassistant.*]
ignore_missing_imports = True
