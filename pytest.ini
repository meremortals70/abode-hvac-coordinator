[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# From 2026.11, Home Assistant aliases httpx to httpx2 on import; respx's own
# pytest plugin imports httpx first, so it is turned off, as pytest-home-assistant
# asks (packages/pytest-home-assistant/README.md, 2026.11.0b0). The respx library
# itself still loads.
addopts = -p no:respx
