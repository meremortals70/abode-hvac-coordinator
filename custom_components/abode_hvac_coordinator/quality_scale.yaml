# Progress against the integration quality scale.
# Rule list taken from developers.home-assistant
# docs/core/integration-quality-scale/_includes/tiers.json
#
# Note: a custom integration cannot be graded. "Custom" is a special tier
# alongside Internal and Legacy. This file tracks compliance so the integration
# is ready if it is ever submitted to core.

rules:
  # --- Bronze ---
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: |
      Evaluation is driven by state changes on the entities each room reads,
      with a 30 second interval as a backstop. Nothing is polled from a device
      or service.
  brands: done
  common-modules: done
  config-flow-test-coverage:
    status: todo
    comment: |
      tests/test_config_flow.py covers the room, outdoor-unit, bands, global
      menu, outdoor, tariff, forecast and power steps, and from 0.9.0 the new
      read of what the air conditioner can do: refusing a room whose unit is
      unavailable, missing or one of two heads, storing the profile, the
      two-head intersection, the opening grace, and editing a room reading its
      unit again. All 37 tests pass against Home Assistant 2026.8.3, the version
      this integration targets, on Python 3.14.

      Still todo because config_flow.py is covered at 90% by the whole suite, not
      in full: the options flow's remove-room, tariff, forecast and several
      power-step error paths have no test of their own.
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No external dependencies. requirements is empty.
  docs-actions: done
  docs-triggers:
    status: exempt
    comment: |
      The integration defines no custom triggers. Standard state triggers on
      its entities are documented in docs/examples.md.
  docs-conditions:
    status: exempt
    comment: The integration defines no custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: |
      Nothing is connected to. Configuration is a set of references to entities
      that already exist in Home Assistant.
  test-before-setup:
    status: exempt
    comment: |
      No device or service to reach. A room whose source entities are missing
      reports unavailable rather than failing setup.
  unique-config-entry: done

  # --- Silver ---
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No authentication of any kind.
  test-coverage:
    status: todo
    comment: |
      The suite is 644 tests (491 over the pure modules) and passes
      against Home Assistant 2026.8.3 on Python 3.14. Measured line coverage of
      the integration at 0.9.1 is 92% overall. The pure decision modules are at
      98% or better; the gaps are actuator.py (79%), __init__.py (76%) and
      coordinator.py (84%), mostly failure paths. The silver tier asks for more
      than 95% in every module, so this stays todo.

      Every new decision in 0.9.0 was checked by putting the defect back and
      watching its test fail; that is recorded in the changelog.

  # --- Gold ---
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Nothing is discovered; rooms are declared by the user.
  discovery:
    status: exempt
    comment: |
      A room is a decision the user makes about their house. There is nothing
      on a network to find.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: |
      No devices are supported or unsupported. The integration consumes any
      climate entity Home Assistant already has.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: |
      Each room carries its sensors, two switches and the controls its air
      conditioner offers (mode, fan speed, vanes, setpoint). All of them are what
      the integration exists to provide, and none is noisy enough to warrant
      being disabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: |
      The config entry itself holds no settings: it is created empty and every
      setting lives in the options flow, which offers add, edit and remove for
      rooms and is reachable from the same integration page. A reconfigure step
      would have nothing to reconfigure. A reviewer may reasonably disagree; if
      so, the fix is to move room configuration into entry data and implement
      async_step_reconfigure over it.
  repair-issues: done
  stale-devices: done

  # --- Platinum ---
  async-dependency:
    status: exempt
    comment: No external library. All integration code is async.
  inject-websession:
    status: exempt
    comment: No HTTP calls are made.
  strict-typing:
    status: todo
    comment: |
      mypy --strict runs clean on all 23 modules except 17 errors in
      actuator.py and sensor.py, every one of them a symbol that moved between
      Home Assistant 2025.1.4 (the newest this Python 3.12 build sandbox can
      install) and the 2026.8.x targeted — ClimateEntityFeature, the climate
      ATTR_* and SERVICE_* names, and AddConfigEntryEntitiesCallback. The
      count is unchanged from 0.8.5, including through 0.8.11. Nothing in
      shipped code depends on the older names. Not "done" until mypy has run
      against the targeted
      version with no errors at all.
