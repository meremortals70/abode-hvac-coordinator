rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Nothing is polled from a device; the cycle runs every 30 s on Home Assistant's own states, the tariff is read every 15 min and the forecast every 30 min.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: The integration has no external dependencies; its matrix arithmetic is its own (linalg.py).
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The integration reads Home Assistant's own entities and needs no authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A room is a choice the user makes, not something on the network.
  discovery-update-info:
    status: exempt
    comment: The integration's devices cannot be discovered.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: exempt
    comment: The integration has no external dependencies; its heavy calculation runs in the executor.
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests.
  strict-typing: done
