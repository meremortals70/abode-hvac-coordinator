# Progress against the integration quality scale.
# Rule list taken from developers.home-assistant
# docs/core/integration-quality-scale/_includes/tiers.json
#
# Note: a custom integration cannot be graded. "Custom" is a special tier
# alongside Internal and Legacy. This file tracks compliance so the integration
# is ready if it is ever submitted to core.

rules:
  # --- Bronze ---
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: |
      Evaluation is driven by state changes on the entities each room reads,
      with a 30 second interval as a backstop. Nothing is polled from a device
      or service.
  brands: done
  common-modules: done
  config-flow-test-coverage:
    status: todo
    comment: |
      tests/test_config_flow.py covers the room, bands, global menu, outdoor,
      tariff, forecast and power steps and, as of 0.8.11, has actually been
      run green — 28 tests, unchanged since 0.8.10, against Home Assistant
      2025.1.4 under pytest-homeassistant-custom-component 0.13.205. 0.8.11
      added no new config-flow steps or fields.

      Still todo, for two reasons. The run was against 2025.1.4, not the
      2026.8.x this integration targets; the build sandbox is Python 3.12 and
      cannot install a newer Home Assistant. And running it green for the
      first time exposed a stale assertion — the naive-forecast test asserted
      an inline forecast fetch that 0.8.4 replaced with a background task, and
      had never been executed to find out. There is no reason to assume that
      was the only one. Not "done" until it has run against the targeted
      version.
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No external dependencies. requirements is empty.
  docs-actions: done
  docs-triggers:
    status: exempt
    comment: |
      The integration defines no custom triggers. Standard state triggers on
      its entities are documented in docs/examples.md.
  docs-conditions:
    status: exempt
    comment: The integration defines no custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: |
      Nothing is connected to. Configuration is a set of references to entities
      that already exist in Home Assistant.
  test-before-setup:
    status: exempt
    comment: |
      No device or service to reach. A room whose source entities are missing
      reports unavailable rather than failing setup.
  unique-config-entry: done

  # --- Silver ---
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No authentication of any kind.
  test-coverage:
    status: todo
    comment: |
      The pure modules have 364 tests in tests/test_core.py, run directly
      with python3 and passing. As of 0.8.11 the Home Assistant side tests
      run too: 443 tests pass in total across test_core, test_attributes,
      test_config_flow and test_init. 0.8.11 added tests for the price-aware
      coast deferral (findings 12/19b), the direct solar offset ahead of the
      battery in the power budget (finding 18), re-asserting the commanded
      setpoint from live entity state rather than memory (finding 19a), and
      the corrected zero-flow handling in the grid sign check — each of the
      new mechanisms checked by reinstating the defect and confirming the
      test fails for the stated reason before being restored.

      Still todo for the same reason as config-flow-test-coverage: the run is
      against Home Assistant 2025.1.4, not the 2026.8.x targeted, and two
      tests that had never executed were found to be asserting behaviour the
      component had already moved away from.

  # --- Gold ---
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Nothing is discovered; rooms are declared by the user.
  discovery:
    status: exempt
    comment: |
      A room is a decision the user makes about their house. There is nothing
      on a network to find.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: |
      No devices are supported or unsupported. The integration consumes any
      climate entity Home Assistant already has.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: |
      Three entities per room, all of them the reason the integration exists.
      None is noisy enough to warrant being disabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: |
      The config entry itself holds no settings: it is created empty and every
      setting lives in the options flow, which offers add, edit and remove for
      rooms and is reachable from the same integration page. A reconfigure step
      would have nothing to reconfigure. A reviewer may reasonably disagree; if
      so, the fix is to move room configuration into entry data and implement
      async_step_reconfigure over it.
  repair-issues: done
  stale-devices: done

  # --- Platinum ---
  async-dependency:
    status: exempt
    comment: No external library. All integration code is async.
  inject-websession:
    status: exempt
    comment: No HTTP calls are made.
  strict-typing:
    status: todo
    comment: |
      mypy --strict runs clean on all 23 modules except 17 errors in
      actuator.py and sensor.py, every one of them a symbol that moved between
      Home Assistant 2025.1.4 (the newest this Python 3.12 build sandbox can
      install) and the 2026.8.x targeted — ClimateEntityFeature, the climate
      ATTR_* and SERVICE_* names, and AddConfigEntryEntitiesCallback. The
      count is unchanged from 0.8.5, including through 0.8.11. Nothing in
      shipped code depends on the older names. Not "done" until mypy has run
      against the targeted
      version with no errors at all.
